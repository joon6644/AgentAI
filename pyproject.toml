[project]
name = "agentai"
version = "0.1.0"
description = "AI Agent 프로젝트 워크스페이스"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crewai>=1.15.18",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.uv]
# 애플리케이션 워크스페이스이므로 자기 자신을 패키지로 빌드/설치하지 않음
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
